name: build container

  on:
    push:
      branches: [main]
      paths: ['container/**', '.github/workflows/container.yml']
    pull_request:
      paths: ['container/**']
    workflow_dispatch:

  permissions:
    contents: read
    packages: write

  jobs:
    build:
      runs-on: ubuntu-latest
      timeout-minutes: 300
      steps:
        - uses: actions/checkout@v4

        - name: Is there a definition file yet?
          id: check
          run: |
            if ls container/*.def >/dev/null 2>&1; then
              echo "def=$(ls container/*.def | head -1)" >> "$GITHUB_OUTPUT"
              echo "found=yes" >> "$GITHUB_OUTPUT"
            else
              echo "no container definition yet - nothing to build"
              echo "found=no" >> "$GITHUB_OUTPUT"
            fi

        # An R image with genomics tools will not fit in a default runner's space.
        - name: Free disk space
          if: steps.check.outputs.found == 'yes'
          run: |
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
            df -h /

        - name: Install Apptainer
          if: steps.check.outputs.found == 'yes'
          run: |
            VER=1.3.6
            wget -q "https://github.com/apptainer/apptainer/releases/download/v${VER}/apptainer_${VER}_amd64.deb"
            sudo apt-get update -qq
            sudo apt-get install -y ./apptainer_${VER}_amd64.deb
            apptainer --version

        - name: Build
          if: steps.check.outputs.found == 'yes'
          run: |
            sudo apptainer build container/image.sif "${{ steps.check.outputs.def }}"
            ls -lh container/image.sif

        # A build that yields a broken image is worse than no image. The
        # definition file's own %test section runs every tool the pipeline calls.
        - name: Smoke test
          if: steps.check.outputs.found == 'yes'
          run: apptainer test container/image.sif

        - name: Publish to GHCR
          if: steps.check.outputs.found == 'yes' && github.event_name == 'push' && github.ref == 'refs/heads/main'
          run: |
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              apptainer remote login -u "${{ github.actor }}" --password-stdin oras://ghcr.io
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            apptainer push container/image.sif "oras://ghcr.io/${REPO}:latest"
            apptainer push container/image.sif "oras://ghcr.io/${REPO}:${GITHUB_SHA::7}"
